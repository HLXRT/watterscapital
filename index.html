<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<title>Watterscapital</title>
		<link rel="icon" type="image/x-icon" href="favicon.ico"/>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,0&icon_names=rainy_light,call" />
		<style>
			/* Fonts */
			@import url('https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap');
			@import url('https://fonts.cdnfonts.com/css/latin-modern-math');
			
			/* Reset: remove default margins and padding */
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			
			/* Lock html and body completely to screen boundaries */
			html, body {
				color: white;
				width: 100%;
				height: 100%;
				overflow: hidden; /* Prevents unwanted document scrolling on mobile */
				cursor: default;
				text-align: center;
				font-family: Mulish, sans-serif;
				overscroll-behavior: none;
				
				-webkit-user-select: none; /* Safari */
				-ms-user-select: none;     /* IE 10 and IE 11 */
				user-select: none;         /* Standard syntax */
				
				background: linear-gradient(#212121, #424242);
			}

			/* Main wrapper forces exact full screen using svh (Small Viewport Height) */
			.full-screen-container {
				width: 100vw;
				height: 100vh;
				height: 100svh; /* Perfect fit for mobile Safari toolbars */
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				position: relative;
				overflow: hidden;
			}

			.watterscapitallogo {
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: clamp(2rem, 8vw, 4.5rem);
				font-weight: 200;
				letter-spacing: -.2vw;
				margin-bottom: 1rem;
				background: -webkit-radial-gradient(#D6D6D6, #212121);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
			}
			
			.material-symbols-outlined {
				font-size: 1.25em; 
				letter-spacing: -.05em;
			}
			
			.tagarea {
				color: #444;
				font-size: clamp(0.8rem, 3vw, 0.95rem);
				font-weight: 300;
				margin-bottom: 1.75rem;
				display: flex;
				align-items: center;
			}
			
			svg {
				position: relative;
				top: 2px;
				filter: drop-shadow(1px 1px 2px #191919);
			}
			
			line {
				stroke: #444;
				stroke-width: 1.25;
			}
			
			.contact {
				font-size: 1rem;
				display: flex;
				align-items: center;
			}
			
			.phone { position: relative; top: .2vh; }
			.FB { position: relative; top: .14vh; padding: 0 .9mm 0 .9mm; }
			.psivr { font-family: 'latin modern math', serif; font-size: larger; padding: 0 0 1mm .75mm; }
			
			a:link {
				color: white;
				cursor: default; 
				text-decoration: none;
				border-bottom: 1px solid transparent;
				transition: color 0.2s ease-in-out, border-bottom 0.2s ease-in-out;
			}
			a:visited { color: white; }
			a:hover {
				cursor: default; 
				color: lightslategrey;
				border-bottom: 1px solid lightslategrey;
			}
			
			footer {
				color: silver;
				padding: 1rem;
				font-size: .75em;
				position: absolute;
				bottom: 0;
				left: 0;
				width: 100%;
				text-align: center;
			}
		</style>
	</head>
	<body>
		<div class="full-screen-container">
			<div class="watterscapitallogo">
				<span class="material-symbols-outlined">rainy_light</span>Watterscapıta/
			</div>
		
			<div class="tagarea">
				los angeles&nbsp;
				<svg height="30" width="12">
					<line x1="12" y1="0" x2="0" y2="30" />
				</svg>
				&nbsp;san francisco
			</div>
			
			<div class="contact">
				<a href="tel:+15102397503" title="(510) 239-7503" class="phone">
					<span class="material-symbols-outlined">call</span>
				</a>
				 &ensp; 
				 <a href="https://www.linkedin.com/company/watters-capital" title="@watterscapital" target="_blank">in</a>
				 &ensp;
				 <a href="mailto:list@watterscapital.com" title="psıvr" class="psivr">𝜓</a>
				 &ensp;
				 <a href="https://www.facebook.com/watterscapital" title="@watterscapital" target="_blank" class="FB">f</a>
			</div>
			
			<footer>Watterscapital, Inc. &copy; 2026</footer>
		</div>
	</body>
</html>
