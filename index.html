		<style>
			@import url('https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap');
			html, body {
				cursor: default;
				font-size: 100%;

			}
			body {
				color: white;
				text-align: center;
				font-family: Mulish;

				background: linear-gradient(#212121, #424242);
				background-repeat: no-repeat;

			}

			.flex-container {
				display: flex;
				font-size: 6vw;
				font-weight:200;
				letter-spacing: -2px;
				padding-top: 35vh;
				align-items: center;
				justify-content: center;
				background: -webkit-radial-gradient(#eee, black);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
			}
			.material-symbols-outlined {font-size: 1.25em; letter-spacing: -.05em;}
			.tagarea {
				color: #444;

			svg {
				position: relative;
				top:20px;

			}
			line {
				stroke: #444;
				stroke-width: 1.25;
				
			}
			.contact {margin-top: 1cm; font-size: 1em;}
			.phone {position: relative; top: .7vh;}
			a:link {
				color: white;
				cursor: default; 
				text-decoration: none;
				border-bottom: 1px solid transparent;
				
				/* 1. Define the transition on the BASE state */
				transition: color 0.2s ease-in-out, border-bottom 0.2s ease-in-out;
			}
			a:visited {color: white;}
			a:hover {
				cursor: default; 
				color: lightslategrey;
				border-bottom: 1px solid lightslategrey;
			}
			
			footer {
				color: silver;
				bottom: 0;
				padding: 5mm;
				font-size: .75rem;
				position: absolute;
			}
		</style>
