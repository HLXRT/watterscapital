<!DOCTYPE html>

	<head>

		<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,0&icon_names=rainy_light,call" />
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap');
			@import url('https://fonts.cdnfonts.com/css/latin-modern-math');
			/*  Reset: remove default margins and padding */
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			
			/* html and body span the full document height */
			html, body {
				color: white;
				width: 100%;
				height: 100%;
				cursor: default;
				text-align: center;
				font-family: Mulish;
				overscroll-behavior: none;
				margin: 0; /* prevents unwanted scroll bars */
				padding: 0; /* prevents unwanted scroll bars */
				
				-webkit-user-select: none; /* Safari */
				-ms-user-select: none;     /* IE 10 and IE 11 */
				user-select: none;         /* Standard syntax */
				
				background: linear-gradient(#212121, #424242);
			}

			/* Main wrapper spans 100% width, full viewport height */
			.full-screen-container {
				width: 100%;
				height: 100vh; /* 100% viewport height */
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.watterscapitallogo {
				display: flex;
				font-size: 6vw;
				font-weight: 200;
				letter-spacing: -.3vw;
				/* padding: 5mm; */
				/* position: absolute; */
				/* top:35vh; */
				background: -webkit-radial-gradient(#D6D6D6, #212121);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
			}
			.material-symbols-outlined {font-size: 1.25em; letter-spacing: -.05em;}
			
			.tagarea {
				color: #444;
				font-size: .9em;
				font-weight: 300;
				position: absolute;
				margin-top: 3.5cm;
			}
			svg {
				position: relative;
				top:20px;
				filter: drop-shadow(1px 1px 2px #191919);
			}
			line {
				stroke: #444;
				stroke-width: 1.25;
				
			}
			.contact {
				position: absolute;
				margin-top: 7.25cm;
				font-size: 1em;
			}
			.phone {position: relative; top: .7vh;}
			.FB {position: relative; top: .14vh; padding: 0 .9mm 0 .9mm}
			.psivr {font-family: latin modern math; font-size: larger; padding: 0 0 1mm .75mm;}
			a:link {
				color: white;
				cursor: default; 
				text-decoration: none;
				border-bottom: 1px solid transparent;
				
				/* 1. Define the transition on the BASE state */
				transition: color 0.2s ease-in-out, border-bottom 0.2s ease-in-out;
			}
			a:visited {color: white;}
			a:hover {
				cursor: default; 
				color: lightslategrey;
				border-bottom: 1px solid lightslategrey;
			}
			
			footer {
				color: silver;
				padding: 5mm;
				font-size: .75em;
				position: absolute;
				bottom: 0;
				left: 0;
			}
		</style>
	</head>
	<body>

</html>
